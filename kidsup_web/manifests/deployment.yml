apiVersion: apps/v1
kind: Deployment
metadata:
  name: kidsupweb
  namespace: ${NAMESPACE}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kidsupweb
  template:
    metadata:
      labels:
        app: kidsupweb
    spec:
      imagePullSecrets:
      - name: eazbee-cr-auth
      containers:
      - name: kidsupweb
        image: "registry.digitalocean.com/eazbeecr/kidsupweb:__TAG__"
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3000"
        - name: HOSTNAME
          value: "0.0.0.0"
        # Wysyłka formularza kontaktowego (app/api/contact/route.ts) — wszystkie
        # wartości z K8s Secret "kidsup-contact-smtp" (namespace ${NAMESPACE}),
        # zakładanego ręcznie, nie trzymanego w repo. Patrz README.md.
        - name: SMTP_HOST
          valueFrom:
            secretKeyRef:
              name: kidsup-contact-smtp
              key: smtp-host
        - name: SMTP_PORT
          valueFrom:
            secretKeyRef:
              name: kidsup-contact-smtp
              key: smtp-port
        - name: SMTP_SECURE
          valueFrom:
            secretKeyRef:
              name: kidsup-contact-smtp
              key: smtp-secure
        - name: SMTP_USER
          valueFrom:
            secretKeyRef:
              name: kidsup-contact-smtp
              key: smtp-user
        - name: SMTP_PASS
          valueFrom:
            secretKeyRef:
              name: kidsup-contact-smtp
              key: smtp-pass
        - name: CONTACT_TO_EMAIL
          valueFrom:
            secretKeyRef:
              name: kidsup-contact-smtp
              key: contact-to-email
        - name: CONTACT_FROM_EMAIL
          valueFrom:
            secretKeyRef:
              name: kidsup-contact-smtp
              key: contact-from-email
        ports:
        - containerPort: 3000
          name: http
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: "/"
            port: 3000
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          successThreshold: 1
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: "/"
            port: 3000
            scheme: HTTP
          initialDelaySeconds: 20
          periodSeconds: 30
          failureThreshold: 3
