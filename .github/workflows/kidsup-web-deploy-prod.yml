name: Kids Up Web Deploy Production

# Wyłącznie ręczne — nic tu się nie odpala samo na push. Buduje świeży obraz
# z aktualnego "main" z ustawieniami prod (NEXT_PUBLIC_ENV=prod) i wdraża go
# na kids-up.pl. Numer builda testowego podajesz tylko po to, żeby wynikowy
# obraz prod-<numer> dało się skojarzyć z tym, co wcześniej sprawdziłeś na
# test.kids-up.pl — sam build i tak dzieje się od nowa, w tym kroku.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Numer builda testowego, który promujesz (tylko do etykiety obrazu prod-<numer>)'
        required: true
        type: string

env:
  REGISTRY: registry.digitalocean.com
  IMAGE: eazbeecr/kidsupweb

jobs:

  build-and-deploy-prod:
    name: 🚀 Build & Deploy to Production
    runs-on: ubuntu-latest
    environment: Production

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DO Container Registry
        run: |
          echo "${{ secrets.DO_REGISTRY_TOKEN }}" \
            | docker login registry.digitalocean.com/eazbeecr --username token --password-stdin

      - name: Build and push Prod image
        uses: docker/build-push-action@v5
        with:
          context: kidsup_web
          file: kidsup_web/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE }}:prod-${{ inputs.tag }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE }}:cache-prod
          cache-to:   type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE }}:cache-prod,mode=max
          build-args: |
            NEXT_PUBLIC_ENV=prod
            NEXT_PUBLIC_SITE_URL=https://kids-up.pl

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_K8S_TOKEN }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Save DigitalOcean kubeconfig
        run: doctl kubernetes cluster kubeconfig save eazbeeaks

      - name: Deploy manifests
        env:
          TAG: prod-${{ inputs.tag }}
          NAMESPACE: prod
          DOMAIN: kids-up.pl
        run: |
          TMP=$(mktemp -d)
          cp kidsup_web/manifests/deployment.yml  "$TMP/"
          cp kidsup_web/manifests/service.yml     "$TMP/"
          cp kidsup_web/manifests/ingress.yml     "$TMP/"
          cp kidsup_web/manifests/ingress-www.yml "$TMP/"

          for f in "$TMP/deployment.yml" "$TMP/service.yml" "$TMP/ingress.yml"; do
            sed -i "s/\${NAMESPACE}/$NAMESPACE/g" "$f"
            sed -i "s/\${DOMAIN}/$DOMAIN/g"       "$f"
            sed -i "s/__TAG__/$TAG/g"             "$f"
          done

          kubectl apply -f "$TMP/service.yml"     -n $NAMESPACE
          kubectl apply -f "$TMP/ingress.yml"     -n $NAMESPACE
          kubectl apply -f "$TMP/ingress-www.yml" -n $NAMESPACE
          kubectl apply -f "$TMP/deployment.yml"  -n $NAMESPACE
          kubectl rollout status deployment/kidsupweb -n $NAMESPACE --timeout=180s
