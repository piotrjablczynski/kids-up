name: Kids Up Web Deploy

on:
  push:
    branches: [main]
    paths:
      - 'kidsup_web/**'
  workflow_dispatch:

env:
  REGISTRY: registry.digitalocean.com
  IMAGE: eazbeecr/kidsupweb

jobs:

  # ─────────────────────────────────────────────────────────────────────────────
  # Build TEST image — test.kids-up.pl (NEXT_PUBLIC_ENV=test → robots.ts blokuje indeksację)
  # ─────────────────────────────────────────────────────────────────────────────
  build-test:
    name: Build & Push Test image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DO Container Registry
        run: |
          echo "${{ secrets.DO_REGISTRY_TOKEN }}" \
            | docker login registry.digitalocean.com/eazbeecr --username token --password-stdin

      - name: Build and push Test image
        uses: docker/build-push-action@v5
        with:
          context: kidsup_web
          file: kidsup_web/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE }}:test-${{ github.run_number }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE }}:cache-test
          cache-to:   type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE }}:cache-test,mode=max
          build-args: |
            NEXT_PUBLIC_ENV=test
            NEXT_PUBLIC_SITE_URL=https://test.kids-up.pl

  # ─────────────────────────────────────────────────────────────────────────────
  # Build PROD image — kids-up.pl (built every push, promoted manually via
  # kidsup-web-deploy-prod.yml, exactly like eazBee's own web-deploy split)
  # ─────────────────────────────────────────────────────────────────────────────
  build-prod:
    name: Build & Push Prod image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DO Container Registry
        run: |
          echo "${{ secrets.DO_REGISTRY_TOKEN }}" \
            | docker login registry.digitalocean.com/eazbeecr --username token --password-stdin

      - name: Build and push Prod image
        uses: docker/build-push-action@v5
        with:
          context: kidsup_web
          file: kidsup_web/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE }}:prod-${{ github.run_number }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE }}:cache-prod
          cache-to:   type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE }}:cache-prod,mode=max
          build-args: |
            NEXT_PUBLIC_ENV=prod
            NEXT_PUBLIC_SITE_URL=https://kids-up.pl

  # ─────────────────────────────────────────────────────────────────────────────
  # Deploy to TEST — automatic, runs right after the test image is built
  # ─────────────────────────────────────────────────────────────────────────────
  deploy-test:
    name: 🚀 Deploy to Test
    needs: build-test
    runs-on: ubuntu-latest
    environment: Staging

    steps:
      - uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DO_K8S_TOKEN }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Save DigitalOcean kubeconfig
        run: doctl kubernetes cluster kubeconfig save eazbeeaks

      - name: Deploy manifests
        env:
          TAG: test-${{ github.run_number }}
          NAMESPACE: test
          DOMAIN: test.kids-up.pl
        run: |
          TMP=$(mktemp -d)
          cp kidsup_web/manifests/deployment.yml "$TMP/"
          cp kidsup_web/manifests/service.yml    "$TMP/"
          cp kidsup_web/manifests/ingress.yml    "$TMP/"

          for f in "$TMP/deployment.yml" "$TMP/service.yml" "$TMP/ingress.yml"; do
            sed -i "s/\${NAMESPACE}/$NAMESPACE/g" "$f"
            sed -i "s/\${DOMAIN}/$DOMAIN/g"       "$f"
            sed -i "s/__TAG__/$TAG/g"             "$f"
          done

          kubectl apply -f "$TMP/service.yml"    -n $NAMESPACE
          kubectl apply -f "$TMP/ingress.yml"    -n $NAMESPACE
          kubectl apply -f "$TMP/deployment.yml" -n $NAMESPACE
          kubectl rollout status deployment/kidsupweb -n $NAMESPACE --timeout=120s
